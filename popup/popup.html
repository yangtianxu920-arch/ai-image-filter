<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { width: 290px; margin: 0; padding: 14px; font: 13px/1.6 system-ui, "Microsoft YaHei", sans-serif; color: #222; }
      h1 { margin: 0 0 10px; font-size: 15px; }
      label { display: flex; align-items: center; gap: 6px; padding: 2px 0; cursor: pointer; }
      fieldset { margin: 10px 0; padding: 6px 10px; border: 1px solid #ddd; border-radius: 6px; }
      legend { color: #666; font-size: 12px; }
      .stats, .hint { margin: 6px 0; color: #666; font-size: 12px; }
      #modelStatus { font-weight: 600; color: #333; }
      .notice { margin: 10px 0 6px; padding: 8px 10px; border-radius: 6px; background: #fff6e5; border: 1px solid #f0d9a8; color: #6b4e16; font-size: 12px; line-height: 1.55; }
      button { padding: 4px 10px; border: 1px solid #ccc; border-radius: 6px; background: #fff; cursor: pointer; }
      button:hover { background: #f3f3f3; }
    </style>
  </head>
  <body>
    <h1 data-i18n="popTitle"></h1>
    <label><input type="checkbox" id="enabled" /> <span data-i18n="popEnabled"></span></label>
    <fieldset>
      <legend data-i18n="popWhenFound"></legend>
      <label><input type="radio" name="mode" value="badge" /> <span data-i18n="popBadge"></span></label>
      <label><input type="radio" name="mode" value="blur" /> <span data-i18n="popBlur"></span></label>
      <label><input type="radio" name="mode" value="hide" /> <span data-i18n="popHide"></span></label>
    </fieldset>
    <label><input type="checkbox" id="weak" /> <span data-i18n="popWeak"></span></label>
    <label><input type="checkbox" id="meta" /> <span data-i18n="popMeta"></span></label>
    <fieldset>
      <legend data-i18n="popModelGroup"></legend>
      <label><input type="checkbox" id="model" /> <span data-i18n="popModel"></span></label>
      <div class="hint" id="modelStatus"></div>
      <div class="hint" data-i18n="popModelHint"></div>
    </fieldset>
    <div class="notice"><b data-i18n="popNoticeTitle"></b><span data-i18n="popNotice"></span></div>
    <div class="stats" id="stats"></div>
    <button id="clear" data-i18n="popClear"></button>
    <script src="../src/i18n.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
